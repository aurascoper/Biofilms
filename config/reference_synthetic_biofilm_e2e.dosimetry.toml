origin_cm = [0.0, 0.0, 0.0]
cylinder_radius_cm = 11.0
cylinder_length_cm = 24.0
membrane_thickness_cm = 0.5

[boundaries]
axial = "vacuum"
radial_outer = "vacuum"

[source]
spectrum_energies_eV = [661655.0]
spectrum_probabilities = [1.0]
spatial = "point_origin"
angular = "isotropic"
# Off every lattice plane: a source born on a plane is born on a surface.
