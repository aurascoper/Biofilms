# synthetic_biofilm_e2e — emitted by biofilm_calibration.reference_system.
# One occupied CPM voxel of edge 12000.0 um represents part of a biomass_parcel, and is assigned OpenMC material 'baseline_biomass' (hydrated_bulk_biofilm) at 1.05 g/cm3.
# Dosimetry stage: Gy/s, so a source rate is written. S = A(t) * sum_j Y_j — keep it separate from the PMF.

# SYNTHETIC: every physical value below is invented to exercise the
# software path. It calibrates nothing and may not be cited as a
# measurement of anything.
# synthetic reference system; every physical value is invented; calibrates nothing

schema_version = 1

[provenance]
reference_system_id = "synthetic_biofilm_e2e"
system_provenance = "declared"
evidence_policy = "synthetic"
execution_class = "synthetic_validation"
target_calibration = false

[geometry]
