# Physical coupling configuration — TEMPLATE.
#
# Every REQUIRED key ships UNSET (commented out). Nothing in this repository
# defines these values and none may be invented (docs/audit_biofilms_potts.md
# §5): the loaders enumerate every missing key in one loud error and refuse
# to proceed. Fill them in from your experiment/design, with units as stated.
#
# Requirements are STAGED — each key below is annotated with the first stage
# that needs it, and the loader only demands that stage's keys:
#
#   transport          geometry, boundaries, source shape + spectrum,
#                      materials       -> heating, eV per source particle
#   dosimetry          + source.photons_per_second          -> Gy/s
#   cpm_feedback       + time.seconds_per_mcs, normalization.*_scale
#   membrane_feedback  + normalization.membrane_statistic
#
# Pick the stage by which loader you call (load_transport_config, ...) or
# `biofilm-dose-scan --stage`. Transport needs no source activity, no CPM
# clock and no biological scales, because the builders read none of them.
#
# The MODEL KIND is chosen the same way — by which builder/loader you call, or
# `biofilm-dose-scan --model` — and is never declared here, so it cannot
# contradict the builder that runs. Required keys differ by kind:
#
#   biofilm_cylinder  needs geometry.voxel_pitch_cm, geometry.membrane_thickness_cm,
#                     and the medium / baseline_biomass / membrane classes;
#                     its tally resolution comes from the snapshot lattice.
#   water_phantom     needs neither pitch nor membrane, and only the medium
#                     class; its tally resolution comes from
#                     transport.mesh.base_dimension.
#
# This template describes the BIOFILM model. For a worked water phantom see
# config/reference_a0_water_phantom.toml.

schema_version = 1

[provenance]
# REQUIRED — what system this is. Four independent axes, because
# `target_calibration = false` alone cannot distinguish a reference benchmark
# from a public surrogate, a synthetic fixture, or an uncalibrated target, and
# a result whose file says only "false" cannot be told apart from any other.

# REQUIRED — the reference system this config represents, matching a
# reference_system_id in data/parameter_provenance.csv.
# reference_system_id =

# REQUIRED — what the system IS. One of: published_replica, certified_component,
# engineered_composite, declared. This axis is NOT about whether the numbers
# were measured: an engineered composite can hold measured, certified, derived
# and declared components at once.
# system_provenance =

# REQUIRED — whether this run may use unmeasured values. One of: measured_only,
# synthetic. Only "synthetic" relaxes the evidence gate, and only the evidence
# gate — coherence, geometry, closure and units are enforced either way.
# evidence_policy =

# REQUIRED — what kind of run this is. One of: reference_benchmark,
# surrogate_validation, synthetic_validation, target_calibration,
# exploratory_sensitivity.
# execution_class =

# REQUIRED — whether this run calibrates the target biological system. Setting
# it true is a claim about the data behind every value above.
# target_calibration =

[geometry]
# REQUIRED — physical edge length of one CPM lattice voxel, cm
# voxel_pitch_cm =

# REQUIRED — physical position of the lattice corner (logical index 0,0,0), cm
# origin_cm = [0.0, 0.0, 0.0]

# REQUIRED — CSG cylinder that contains the biomass lattice, cm.
# The CPM's -1 voxels mean "outside the biological domain", NOT membrane
# material (audit §6): the membrane is modeled as a finite annulus here.
# cylinder_radius_cm =
# cylinder_length_cm =
# membrane_thickness_cm =

[boundaries]
# REQUIRED — outer boundary conditions: "vacuum" or "reflective"
# axial =
# radial_outer =

[time]
# REQUIRED — physical seconds per CPM Monte Carlo step. This is the single
# time authority; the radiodialysis solver derives its interval from it
# (internal substeps chosen automatically for explicit-Euler stability).
# seconds_per_mcs =

[source]
# REQUIRED (dosimetry) — physical photon emission rate, photons/s. This is
# the TOTAL emission rate S = A * sum_j Y_j, where Y_j is photons per decay
# for line j. Not needed to run or compare transport.
# photons_per_second =

# REQUIRED (transport) — discrete emission spectrum: line energies (eV) and
# probabilities (same length). The probabilities are a normalized PMF and
# must SUM TO 1: p_j = Y_j / sum_k Y_k. The loader does NOT normalize them —
# it rejects anything that does not already sum to 1, so that a nuclide
# emitting more than one photon per decay cannot be silently mis-normalized.
# spectrum_energies_eV = []
# spectrum_probabilities = []

# REQUIRED (transport) — spatial distribution: "line_z_axis" | "point_origin".
# Both are IDEALIZED. There is no sealed-capsule source: no active core, no
# encapsulation, no self-attenuation. See docs/physical_reference_system.md.
# spatial =

# REQUIRED (transport) — angular distribution: "isotropic"
# angular =

# REQUIRED FOR biofilm_cylinder (optional at the loader) — explicit source
# position, cm. Absent means "let the builder centre it", and the derived
# centre lands exactly on internal lattice planes for every EVEN lattice size,
# so a particle is born on a surface in all three dimensions. The biofilm
# builder refuses that; see `model.check_source_placement`.
# position_cm = [0.0, 0.0, 0.0]

[normalization]
# REQUIRED — separate transforms for the THREE consumers of radiation in the
# CPM (audit §5): Metropolis Hamiltonian, melanin production, membrane model.
# Linear form: signal = scale × dose_rate_Gy_s. Scales MUST come from a
# declared calibration; no default exists.
# hamiltonian_scale =
# melanin_scale =

# REQUIRED — statistic mapping the voxel dose field to the membrane model's
# scalar dose rate: "mass_weighted" | "area_weighted".
# STOP CONDITION (audit §6): even with this set, OpenMC dose must not feed
# the radiodialysis model until the m-vs-P_eff constitutive choice is made.
# membrane_statistic =

[transport]
# Optional Monte Carlo run controls (recorded in every result file)
batches = 10
particles = 10000
seed = 1

  [transport.mesh]
  # Tally resolution, INDEPENDENT of the physical geometry. The mesh used to be
  # welded to the lattice, so changing the pitch to sweep resolution also
  # changed the size of the modeled apparatus.
  #
  # Mesh dimension = base / coarsening_factor, and the factor must divide the
  # base exactly, so meshes are nested and a fine result can be aggregated onto
  # a coarse one. The biofilm model takes its base from the snapshot lattice
  # (n,n,n); base_dimension is REQUIRED for a water phantom and unused here.
  coarsening_factor = 1
  # base_dimension = [48, 48, 48]   # water_phantom only

[materials]
# REQUIRED — config-defined material class table (arbitrary names; the
# minimum honest set is below). Each class needs density_g_cm3 and element
# MASS fractions summing to 1. Classes are deduplicated by composition;
# lineage/cell labels NEVER become materials.
#
# [materials.medium]
# density_g_cm3 =
#   [materials.medium.elements]
#   H =
#   O =
#
# [materials.baseline_biomass]
# density_g_cm3 =
#   [materials.baseline_biomass.elements]
#   H =
#   C =
#   N =
#   O =
#
# [materials.membrane]
# density_g_cm3 =
#   [materials.membrane.elements]
#   C =
#   H =
