<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Primary Fuel Source Geolocator · 3D Globe</title>
<style>
  :root {
    --bg: #0a0e1a; --panel: rgba(16,22,40,0.85); --ink: #e8ecf4;
    --ink-soft: #9aa7c0; --line: #1e2a44; --accent: #5d9bff;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  #globe { position:fixed; inset:0; }
  #hud { position:fixed; top:16px; left:16px; z-index:10; max-width:300px;
    background:var(--panel); border:1px solid var(--line); border-radius:10px;
    padding:14px 16px; backdrop-filter:blur(6px); }
  #hud h1 { font-size:15px; font-weight:600; margin-bottom:2px; }
  #hud .sub { font-size:11px; color:var(--ink-soft); margin-bottom:10px; }
  #hud .stat { font-size:12px; color:var(--ink-soft); margin-bottom:8px; }
  #hud .stat b { color:var(--ink); }
  #legend { margin-top:6px; }
  #legend .row { display:flex; align-items:center; gap:8px; font-size:11px;
    color:var(--ink-soft); margin-bottom:3px; }
  #legend .swatch { width:10px; height:10px; border-radius:2px; flex:0 0 auto; }
  #legend .row b { color:var(--ink); font-weight:600; }
  #controls { position:fixed; bottom:16px; left:16px; z-index:10;
    background:var(--panel); border:1px solid var(--line); border-radius:10px;
    padding:10px 14px; display:flex; gap:8px; align-items:center; }
  #controls label { font-size:11px; color:var(--ink-soft); }
  #controls select, #controls input { background:#0d1424; color:var(--ink);
    border:1px solid var(--line); border-radius:6px; padding:4px 8px; font-size:11px; }
  #tooltip { position:fixed; z-index:20; pointer-events:none; background:var(--panel);
    border:1px solid var(--line); border-radius:8px; padding:8px 12px; font-size:11px;
    color:var(--ink); display:none; max-width:260px; }
  #tooltip .t-name { font-weight:600; margin-bottom:2px; }
  #tooltip .t-row { color:var(--ink-soft); }
  #loading { position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    background:var(--bg); z-index:30; font-size:14px; color:var(--ink-soft); }
</style>
</head>
<body>
<div id="globe"></div>
<div id="loading">Loading power-plant globe…</div>
<div id="hud">
  <h1>Primary Fuel Source Geolocator</h1>
  <div class="sub">3D geo-spatial · WRI Global Power Plant Database</div>
  <div class="stat">Plants: <b id="stat-count">—</b> · Capacity: <b id="stat-cap">—</b> MW</div>
  <div id="legend"></div>
</div>
<div id="controls">
  <label>Fuel</label>
  <select id="fuel-filter"><option value="">All</option></select>
  <label>Min MW</label>
  <input id="min-cap" type="number" value="0" min="0" style="width:70px">
  <button id="apply" style="background:var(--accent);color:#04101f;border:none;border-radius:6px;padding:4px 12px;font-size:11px;font-weight:600;cursor:pointer">Apply</button>
</div>
<div id="tooltip"></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script>
const API = '';
let scene, camera, renderer, controls, globeGroup, raycaster, mouse;
let plants = [], markers = [], fuelColors = {};

init();
loadFuels();
loadStats();
loadPlants();

function init() {
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 1000);
  camera.position.set(0, 0, 3.2);
  renderer = new THREE.WebGLRenderer({ antialias:true });
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  document.getElementById('globe').appendChild(renderer.domElement);

  controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true; controls.dampingFactor = 0.08;
  controls.minDistance = 1.4; controls.maxDistance = 8;

  // Stars
  const stars = new THREE.Points(
    new THREE.BufferGeometry().setFromPoints(
      Array.from({length:2000}, () => new THREE.Vector3(
        (Math.random()-0.5)*200, (Math.random()-0.5)*200, (Math.random()-0.5)*200))),
    new THREE.PointsMaterial({ color:0xffffff, size:0.15, transparent:true, opacity:0.6 }));
  scene.add(stars);

  // Globe
  const geo = new THREE.SphereGeometry(1, 64, 64);
  const mat = new THREE.MeshPhongMaterial({ color:0x0d1424, transparent:true, opacity:0.92 });
  globeGroup = new THREE.Group();
  const sphere = new THREE.Mesh(geo, mat);
  globeGroup.add(sphere);

  // Graticule (lat/long lines)
  const lineMat = new THREE.LineBasicMaterial({ color:0x1e2a44, transparent:true, opacity:0.5 });
  for (let lat=-80; lat<=80; lat+=20) {
    const pts=[]; for (let lon=-180; lon<=180; lon+=5) pts.push(latLonToVec3(lat,lon,1.001));
    globeGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), lineMat));
  }
  for (let lon=-180; lon<180; lon+=20) {
    const pts=[]; for (let lat=-90; lat<=90; lat+=5) pts.push(latLonToVec3(lat,lon,1.001));
    globeGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), lineMat));
  }
  scene.add(globeGroup);

  // Lights
  scene.add(new THREE.AmbientLight(0x404060, 0.6));
  const dir = new THREE.DirectionalLight(0xffffff, 1.0);
  dir.position.set(2,1,3); scene.add(dir);

  raycaster = new THREE.Raycaster();
  mouse = new THREE.Vector2();
  renderer.domElement.addEventListener('mousemove', onMouseMove);
  renderer.domElement.addEventListener('click', onMouseMove);

  window.addEventListener('resize', () => {
    camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });
  animate();
}

function latLonToVec3(lat, lon, r=1.0) {
  const phi = (90-lat)*Math.PI/180, theta = (lon+180)*Math.PI/180;
  return new THREE.Vector3(
    -r*Math.sin(phi)*Math.cos(theta),
    r*Math.cos(phi),
    r*Math.sin(phi)*Math.sin(theta));
}

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}

async function loadFuels() {
  const r = await fetch(API+'/api/fuels'); const d = await r.json();
  fuelColors = {}; const legend = document.getElementById('legend');
  const sel = document.getElementById('fuel-filter');
  d.fuels.forEach(f => {
    fuelColors[f.fuel] = f.color;
    const row = document.createElement('div'); row.className='row';
    row.innerHTML = `<span class="swatch" style="background:${f.color}"></span><b>${f.fuel}</b> (${f.count})`;
    legend.appendChild(row);
    const opt = document.createElement('option'); opt.value=f.fuel; opt.textContent=f.fuel;
    sel.appendChild(opt);
  });
}

async function loadStats() {
  const r = await fetch(API+'/api/stats'); const d = await r.json();
  document.getElementById('stat-count').textContent = d.plant_count;
  document.getElementById('stat-cap').textContent = d.total_capacity_mw.toLocaleString();
}

async function loadPlants() {
  const fuel = document.getElementById('fuel-filter').value;
  const minCap = document.getElementById('min-cap').value || 0;
  const q = new URLSearchParams({ min_capacity: minCap, limit: 5000 });
  if (fuel) q.set('fuel', fuel);
  const r = await fetch(API+'/api/plants?'+q); const d = await r.json();
  plants = d.features;
  renderMarkers();
  document.getElementById('loading').style.display='none';
}

function renderMarkers() {
  markers.forEach(m => globeGroup.remove(m));
  markers = [];
  const maxCap = Math.max(...plants.map(p => p.properties.capacity_mw||0), 1);
  plants.forEach(p => {
    const cap = p.properties.capacity_mw||0;
    const size = 0.004 + 0.03*Math.sqrt(cap/maxCap);
    const color = new THREE.Color(p.properties.color || '#BDC3C7');
    const geo = new THREE.SphereGeometry(size, 8, 8);
    const mat = new THREE.MeshBasicMaterial({ color });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.copy(latLonToVec3(p.geometry.coordinates[1], p.geometry.coordinates[0], 1.01));
    mesh.userData = p.properties;
    globeGroup.add(mesh);
    markers.push(mesh);
  });
}

function onMouseMove(e) {
  const rect = renderer.domElement.getBoundingClientRect();
  mouse.x = ((e.clientX-rect.left)/rect.width)*2-1;
  mouse.y = -((e.clientY-rect.top)/rect.height)*2+1;
  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObjects(markers);
  const tip = document.getElementById('tooltip');
  if (hits.length) {
    const p = hits[0].object.userData;
    tip.style.display='block';
    tip.style.left=(e.clientX+14)+'px'; tip.style.top=(e.clientY+14)+'px';
    tip.innerHTML = `<div class="t-name">${p.name||'Unnamed'}</div>
      <div class="t-row">${p.country||''} · ${p.primary_fuel||''}</div>
      <div class="t-row">Capacity: ${(p.capacity_mw||0).toLocaleString()} MW</div>
      <div class="t-row">Gen 2013: ${(p.generation_gwh_2013||0).toLocaleString()} GWh</div>`;
  } else {
    tip.style.display='none';
  }
}

document.getElementById('apply').addEventListener('click', loadPlants);
</script>
</body>
</html>
