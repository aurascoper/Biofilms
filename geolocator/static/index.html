<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Primary Fuel Source Geolocator · 3D Globe</title>
<style>
  /* Colour and type come from app/tokens.js, which writes these custom
     properties onto :root. The values below are only a pre-paint fallback so
     the shell does not flash white before the module graph resolves. */
  :root {
    --bg:#040c10; --panel:rgba(4,12,16,0.82); --panel-sel:rgba(5,18,24,0.94);
    --line:rgba(190,232,242,0.18); --line-sel:rgba(107,232,255,0.72);
    --ink:rgba(232,240,244,0.96); --ink-soft:rgba(147,161,173,0.92);
    --accent:#6be8ff; --radius:4px;
    --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
    --lat-w:290px;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; background:var(--bg); color:var(--ink); font-family:var(--mono);
    font-size:11px; overflow:hidden; }
  #globe { position:fixed; inset:0 var(--lat-w) 0 0; }
  #detection-root { position:fixed; inset:0 var(--lat-w) 0 0; pointer-events:none; z-index:5; }

  .panel { background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
    backdrop-filter:blur(6px); }
  .eyebrow { font-size:9.5px; letter-spacing:0.13em; text-transform:uppercase; color:var(--ink-soft); }

  /* ── HUD ─────────────────────────────────────────────────────────────── */
  #hud { position:fixed; top:14px; left:14px; z-index:10; width:274px; padding:12px 14px; }
  #hud.hidden { display:none; }
  #hud h1 { font-size:12px; font-weight:600; letter-spacing:0.04em; margin-bottom:3px; }
  #hud .sub { font-size:9.5px; letter-spacing:0.11em; text-transform:uppercase;
    color:var(--ink-soft); margin-bottom:9px; }
  .stat { font-size:11px; color:var(--ink-soft); margin-bottom:6px; }
  .stat b { color:var(--ink); font-weight:600; font-variant-numeric:tabular-nums; }
  #stat-trunc { color:#e07b39; }
  #legend { margin-top:6px; max-height:170px; overflow-y:auto; }
  #legend .row { display:flex; align-items:center; gap:7px; font-size:10.5px;
    color:var(--ink-soft); margin-bottom:3px; }
  .swatch { width:9px; height:9px; border-radius:2px; flex:0 0 auto; }
  #legend .row b { color:var(--ink); font-weight:600; }
  #measured { display:none; margin-top:8px; padding-top:8px; border-top:1px solid var(--line);
    font-size:10.5px; color:var(--ink-soft); }
  #measured .row { margin-bottom:3px; }
  #measured b { color:var(--ink); }

  /* ── layer registry ──────────────────────────────────────────────────── */
  #controls { position:fixed; bottom:14px; left:14px; z-index:10; width:274px; padding:9px 10px; }
  #layer-panel { display:flex; flex-direction:column; gap:2px; margin-bottom:8px; }
  .layer-row { display:flex; align-items:center; gap:7px; width:100%; padding:4px 6px;
    background:transparent; border:1px solid transparent; border-radius:3px;
    color:var(--ink-soft); font:inherit; font-size:10.5px; cursor:pointer; text-align:left; }
  .layer-row:hover { border-color:var(--line); }
  .layer-row.on { background:var(--panel-sel); border-color:var(--line); color:var(--ink); }
  .l-icon { width:13px; flex:0 0 auto; opacity:0.85; }
  .l-name { flex:1 1 auto; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .l-count { font-variant-numeric:tabular-nums; opacity:0.6; font-size:9.5px; }
  .l-chip, .lat-chip { border:1px solid currentColor; border-radius:2px; padding:0 4px;
    font-size:8.5px; letter-spacing:0.08em; flex:0 0 auto; }
  .filters { display:flex; gap:6px; align-items:center; flex-wrap:wrap;
    padding-top:8px; border-top:1px solid var(--line); }
  .filters label { color:var(--ink-soft); font-size:9.5px; letter-spacing:0.1em;
    text-transform:uppercase; }
  .filters select, .filters input { background:#061219; color:var(--ink); font:inherit;
    font-size:10.5px; border:1px solid var(--line); border-radius:3px; padding:3px 6px; }
  .filters input { width:62px; }

  /* ── sensor styles ───────────────────────────────────────────────────── */
  #styles { position:fixed; bottom:14px; left:50%; transform:translateX(calc(-50% - var(--lat-w)/2));
    z-index:10; padding:6px 10px; display:flex; gap:9px; align-items:center; }
  #style-name { color:var(--accent); letter-spacing:0.12em; font-size:10px; }
  #style-keys { display:flex; gap:3px; }
  .sk { border:1px solid var(--line); border-radius:2px; padding:0 4px; font-size:9px;
    color:var(--ink-soft); }
  .sk.on { border-color:var(--accent); color:var(--accent); }
  .sk.bad { opacity:0.3; text-decoration:line-through; }
  #styles .hint { color:var(--ink-soft); font-size:9px; letter-spacing:0.08em; }

  /* ── lattice ─────────────────────────────────────────────────────────── */
  #lattice { position:fixed; top:0; right:0; bottom:0; width:var(--lat-w); z-index:10;
    border-left:1px solid var(--line); background:var(--panel); backdrop-filter:blur(6px);
    padding:12px; overflow-y:auto; opacity:0.35; transition:opacity 0.2s; }
  #lattice.on { opacity:1; }
  .lat-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
  .lat-eyebrow { font-size:9.5px; letter-spacing:0.13em; text-transform:uppercase; color:var(--ink-soft); }
  .lat-mission { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:10px; font-size:10px; }
  .lat-mission .k { color:var(--ink-soft); letter-spacing:0.08em; text-transform:uppercase;
    font-size:8.5px; margin-right:4px; }
  .lat-mission .v { color:var(--ink); }
  #lat-canvas { display:block; width:100%; }
  .lat-functor { display:flex; flex-wrap:wrap; gap:3px; align-items:center; margin:10px 0 8px;
    font-size:8.5px; letter-spacing:0.06em; }
  .fn { border:1px solid var(--line); border-radius:2px; padding:1px 4px; color:var(--ink-soft); }
  .fn.dim { opacity:0.35; }
  .fn-arr { color:var(--ink-soft); opacity:0.5; }
  .lat-foot { font-size:9.5px; color:var(--ink-soft); border-top:1px solid var(--line);
    padding-top:7px; }
  .lat-foot .caveat { margin-top:5px; opacity:0.75; line-height:1.45; }

  /* ── detection ───────────────────────────────────────────────────────── */
  .det-box { position:absolute; display:none; border:1px solid var(--accent);
    background:rgba(4,12,16,0.56); border-radius:2px; }
  .det-id { position:absolute; left:0; top:100%; font-size:8.5px; color:var(--ink);
    background:rgba(4,12,16,0.56); padding:0 2px; white-space:nowrap; letter-spacing:0.04em; }

  /* ── chrome ──────────────────────────────────────────────────────────── */
  #tooltip { position:fixed; z-index:20; pointer-events:none; background:var(--panel-sel);
    border:1px solid var(--line-sel); border-radius:var(--radius); padding:7px 10px;
    font-size:10.5px; color:var(--ink); display:none; max-width:250px; line-height:1.5; }
  #tooltip .t-name { font-weight:600; margin-bottom:2px; }
  #tooltip .t-row { color:var(--ink-soft); }
  #provenance { position:fixed; bottom:4px; left:50%;
    transform:translateX(calc(-50% - var(--lat-w)/2)); z-index:9; font-size:8.5px;
    color:var(--ink-soft); opacity:0.55; letter-spacing:0.05em; pointer-events:none; }
  #keys { position:fixed; top:14px; right:calc(var(--lat-w) + 14px); z-index:10;
    padding:5px 9px; font-size:9px; color:var(--ink-soft); letter-spacing:0.08em; }
  #loading { position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    background:var(--bg); z-index:30; font-size:11px; color:var(--ink-soft);
    letter-spacing:0.14em; text-transform:uppercase; }
  @media (max-width:900px) { :root { --lat-w:0px; } #lattice { display:none; } }
</style>
</head>
<body>
<div id="globe"></div>
<div id="detection-root"></div>
<div id="loading">Loading energy globe…</div>

<div id="hud" class="panel">
  <h1>Primary Fuel Source Geolocator</h1>
  <div class="sub">3D geo-spatial · energy × market lattice</div>
  <div class="stat">Sites: <b id="stat-count">—</b> · Capacity: <b id="stat-cap">—</b> MW</div>
  <div class="stat" id="stat-trunc" style="display:none"></div>
  <div id="legend"></div>
  <div id="measured"></div>
</div>

<div id="controls" class="panel">
  <div id="layer-panel"></div>
  <div class="filters">
    <label>Fuel/Stage</label>
    <select id="fuel-filter"><option value="">All</option></select>
    <label>Min MW</label>
    <input id="min-cap" type="number" value="0" min="0">
  </div>
</div>

<div id="styles" class="panel">
  <span class="eyebrow">Sensor view</span>
  <span id="style-name">NORMAL</span>
  <span id="style-keys"></span>
</div>

<div id="keys" class="panel">H hud · D detection <span id="det-state">OFF</span> · 1–7 sensor</div>
<div id="lattice"><div id="lattice-body"></div></div>
<div id="tooltip"></div>
<div id="provenance"></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/shaders/CopyShader.js"></script>
<script type="module" src="./app/main.js"></script>
</body>
</html>
