name: model-contracts

on:
  push:
    branches: [master, "feat/**", "ci/**", "research/**"]
    paths:
      - "analysis/**"
      - "*.R"
      - "*.jl"
      - "preprint/**"
      - ".github/workflows/model-contracts.yml"
  pull_request:
    paths:
      - "analysis/**"
      - "*.R"
      - "*.jl"
      - "preprint/**"
      - ".github/workflows/model-contracts.yml"
  workflow_dispatch:
    inputs:
      require_explicit_euler_stability:
        description: "Make the current explicit-Euler time-step diagnostic blocking"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: model-contracts-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  radiodialysis-stability:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install numerical audit dependency
        run: python -m pip install numpy
      - name: Verify continuous and semi-discrete stability contracts
        shell: bash
        run: |
          extra=""
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.require_explicit_euler_stability }}" == "true" ]]; then
            extra="--require-explicit-euler-stability"
          fi
          python analysis/verify_radiodialysis_stability.py \
            --output artifacts/radiodialysis-stability.json $extra
      - name: Summarize the time-step diagnostic
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          p = Path("artifacts/radiodialysis-stability.json")
          print("## Radiodialysis stability audit")
          if not p.exists():
              print("No report was produced.")
          else:
              r = json.loads(p.read_text())
              fv = r["finite_volume_semidiscrete"]
              eu = r["explicit_euler"]
              print(f"- Continuous/semi-discrete contract: **{r['overall_continuous_contract_passed']}**")
              print(f"- Semi-discrete max Re(lambda): `{fv['max_real_eigenvalue']:.6g}`")
              print(f"- Explicit-Euler dt: `{eu['dt']}`")
              print(f"- Max amplification |1+dt*lambda|: `{eu['max_amplification']:.6g}`")
              print(f"- Explicit-Euler stable at that dt: **{eu['stable']}**")
              print("\nA stable continuous operator does not by itself license an explicit time step.")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: radiodialysis-stability-report
          path: artifacts/radiodialysis-stability.json
          if-no-files-found: warn

  r-syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
      - name: Parse all top-level R models without executing Shiny apps
        shell: Rscript {0}
        run: |
          files <- Sys.glob("*.R")
          stopifnot(length(files) > 0)
          for (f in files) {
            parse(file = f)
            cat("PARSE_OK", f, "\n")
          }

      # parse() is not execution.  It passes on a file whose every numerical
      # result is wrong, so this job was green over code that ran nowhere.
      - name: Install deSolve
        run: sudo apt-get update && sudo apt-get install -y r-cran-desolve

      - name: Run the radiodialysis depth-geometry verifier
        run: Rscript analysis/verify_biofilm_depth_profile.R --report r-verify.json

      # Assert on the RECEIPT, not on the exit status.  If the setup step above
      # fails or is dropped, the verifier reports its deSolve check as SKIPPED;
      # a job that exits 0 having skipped is the ALL-PASS-over-skip bug moved
      # from R into YAML.  EXPECTED_CHECKS must be bumped deliberately when
      # checks are added, so silently losing one fails the build.
      - name: Assert the verifier actually ran everything
        shell: Rscript {0}
        run: |
          EXPECTED_CHECKS <- 13L
          if (!file.exists("r-verify.json"))
            stop("no receipt: the verifier did not run to completion")
          j <- readLines("r-verify.json", warn = FALSE)
          num <- function(k) as.integer(sub(
            paste0('.*"', k, '": *([0-9]+).*'), "\\1", j))
          ran <- num("checks_run"); fail <- num("failures"); skip <- num("skipped")
          cat(sprintf("receipt: %d run, %d failed, %d skipped\n", ran, fail, skip))
          if (skip > 0L) stop("verifier skipped ", skip, " check(s): ", j)
          if (fail > 0L) stop("verifier reported ", fail, " failure(s)")
          if (ran != EXPECTED_CHECKS)
            stop("expected ", EXPECTED_CHECKS, " checks, receipt says ", ran,
                 " -- a check was added or silently lost; update EXPECTED_CHECKS")
          cat("R verifier ran complete.\n")

  manuscript-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install minimal LaTeX toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            latexmk lmodern texlive-fonts-recommended texlive-latex-extra texlive-science
      - name: Compile the manuscript from source
        working-directory: preprint
        run: latexmk -pdf -interaction=nonstopmode -halt-on-error modeling_radioresistance_and_radiotropic_fitness.tex
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: manuscript-pdf
          path: preprint/modeling_radioresistance_and_radiotropic_fitness.pdf
          if-no-files-found: error
