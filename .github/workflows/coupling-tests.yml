name: coupling-tests

on:
  push:
    branches: [master, "feat/**", "ci/**", "research/**"]
  pull_request:
  workflow_dispatch:
    inputs:
      run_openmc_integration:
        description: "Run the OpenMC API tier (executable present; nuclear-data tests remain gated)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: coupling-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  julia-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.12"
      - uses: julia-actions/cache@v2
      - name: Instantiate
        run: julia --project=. -e 'import Pkg; Pkg.instantiate()'
      - name: Run Julia test suite
        run: julia --project=. tests/runtests.jl

  python-unit:
    # The Python suite contains Julia/HDF5 orientation round-trip tests.
    # Set up and instantiate the recorded Julia project here rather than
    # relying on whatever /usr/bin/julia happens to exist on the runner.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.12"
      - uses: julia-actions/cache@v2
      - name: Instantiate Julia dependencies for interop tests
        run: julia --project=. -e 'import Pkg; Pkg.instantiate()'
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            contract/pyproject.toml
            coupling/pyproject.toml
      - name: Install package (bare)
        run: pip install -e contract && pip install -e "coupling[dev]"
      - name: Run shared-contract tier
        # Runs here rather than in its own job because one of its tests asserts
        # that the coupling loader and the contract share ONE vocabulary object,
        # which needs both installed.
        run: pytest -rs contract/tests
      - name: Run unit tier
        run: cd coupling && pytest -rs tests

  calibration-unit:
    # Calibration contracts and harnesses: numpy/pytest only, no transport
    # stack. Separate package from coupling/ because it answers biological
    # questions, and separate from the top-level tests/ directory because that
    # one is the Julia suite.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # The claims-ledger guard asserts that the revision the manuscript
          # cites actually resolves. actions/checkout defaults to a depth-1
          # clone, where almost no commit resolves, so without full history
          # the check fails on a fact about the CHECKOUT rather than the repo.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            contract/pyproject.toml
            calibration/pyproject.toml
      - name: Install package
        run: pip install -e contract && pip install -e "calibration[dev]"
      - name: Run calibration tier
        run: cd calibration && pytest -rs tests

  openmc-integration:
    # Manual opt-in: pinned conda-forge OpenMC. The hosted runner does not
    # carry the 13 GB photon library, so tests requiring nuclear data must
    # report SKIPPED rather than being represented as passed.
    if: github.event_name == 'workflow_dispatch' && inputs.run_openmc_integration
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: mamba-org/setup-micromamba@v1
        with:
          environment-name: openmc-biofilms
          create-args: >-
            -c conda-forge
            openmc=0.15.3
            h5py
            numpy
            pytest
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.12"
      - name: Instantiate Julia dependencies for interop tests
        run: julia --project=. -e 'import Pkg; Pkg.instantiate()'
      - name: Install package
        shell: micromamba-shell {0}
        run: pip install -e contract && pip install -e "coupling[dev]"
      - name: Run API tier and report data-gated skips
        shell: micromamba-shell {0}
        run: cd coupling && pytest -rs tests
