[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "biofilm-calibration"
version = "0.1.0"
description = "Calibration contracts and analysis harnesses for the CPM biofilm model"
requires-python = ">=3.11"
# Deliberately numpy-only. These are schema and metric harnesses; no imaging
# stack, no optimizer, no inference framework. Add one when a measured dataset
# exists to justify it.
dependencies = ["numpy"]

[project.optional-dependencies]
dev = ["pytest"]
# Readers for microscopy formats. The CORE NEVER IMPORTS THESE — ingest.py
# defines a format-agnostic contract (array + voxel calibration + declared
# segmentation basis) and readers are called by the caller. Tests that need
# one use importorskip, so they SKIP rather than fail when it is absent,
# exactly as the OpenMC tier does in coupling/.
dataset = ["nd2", "tifffile"]

[tool.setuptools.packages.find]
include = ["biofilm_calibration*"]

[tool.pytest.ini_options]
# Same rationale as coupling/: gated tests skip rather than deselect, so the
# report always distinguishes passed / failed / SKIPPED.
markers = [
    "needs_measured_data: requires a measured dataset that does not exist yet",
]
