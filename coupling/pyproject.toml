[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "biofilm-openmc"
version = "0.1.0"
description = "CPM biofilm <-> OpenMC photon-transport coupling (offline-first)"
requires-python = ">=3.11"
dependencies = ["numpy", "h5py", "biofilm-contract"]

[project.scripts]
biofilm-dose-scan = "biofilm_openmc.drivers:main_scan"

[project.optional-dependencies]
# The real transport stack is provided by the pinned conda env
# (conda-forge openmc=0.15.3, see docs); this extra only documents the pin.
openmc = ["openmc==0.15.3"]
# The read-only observer. PyVista is a DISPLAY CONSUMER of the viewer
# bundle: nothing in the core imports it, and biofilm_openmc.observer
# imports it function-locally so the whole contract stays testable in the
# bare tier.
viewer = ["pyvista>=0.44"]
# PyVista IS IN dev DELIBERATELY. It is not needed to import anything here --
# that is the point of the function-local import -- but leaving it out meant
# the eight render tests SKIPPED everywhere, and a NameError, a mis-slotted
# species palette and a crash on an empty field all shipped behind those skips
# in a single session. A skip is uncovered surface, not a neutral fact.
#
# PyYAML for the same reason, one step earlier. test_gate_composition.py parses
# golden-tally-verification.yml's `on:` block to prove every fixture-producing
# module is in BOTH trigger filters -- a substring search over the file text
# passed while the pull_request trigger was missing entirely. It resolves today
# only as a transitive dependency of something else, which works until whatever
# pulls it stops, so state it rather than inherit it.
dev = ["pytest", "pyvista>=0.44", "pyyaml"]

[tool.setuptools.packages.find]
include = ["biofilm_openmc*"]

[tool.pytest.ini_options]
markers = [
    "openmc_api: needs the OpenMC Python API importable (no transport run, no nuclear data)",
    "openmc: needs the OpenMC executable AND nuclear data (OPENMC_CROSS_SECTIONS)",
    "viewer: needs the viewer extra (PyVista) for actual rendering",
]
# No -m deselection: gated tests use skipif so accounting is always
# passed/failed/SKIPPED — deselected tests hide from the report.
